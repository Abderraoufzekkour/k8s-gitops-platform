apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-app-secret
  namespace: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sample-app-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: my-app/config
        property: username
    - secretKey: password
      remoteRef:
        key: my-app/config
        property: password
