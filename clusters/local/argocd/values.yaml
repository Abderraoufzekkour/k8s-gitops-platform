# ArgoCD Helm values
# Production-grade configuration for local k3s cluster

global:
  domain: argocd.local

configs:
  params:
    server.insecure: true

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: "local-ca-issuer"

repoServer:
  initContainers: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
