# ArgoCD Helm values
# Production-grade configuration for local k3s cluster

global:
  domain: argocd.local

configs:
  params:
    # Run server without TLS (TLS handled by ingress-nginx)
    server.insecure: true

server:
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local

repoServer:
  initContainers: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
