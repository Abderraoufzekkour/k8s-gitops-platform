apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://gateway.envoyproxy.io/helm-charts
      chart: gateway-helm
      targetRevision: v1.3.2
      helm:
        valueFiles:
          - $values/clusters/local/envoy-gateway/values.yaml
    - repoURL: https://github.com/Abderraoufzekkour/k8s-gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
