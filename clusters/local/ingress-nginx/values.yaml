# ingress-nginx Helm values
# Production-grade configuration for local k3s cluster

controller:
  # Use DaemonSet to run on every node
  kind: DaemonSet

  # Service configuration
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Enable metrics for Prometheus
  metrics:
    enabled: true
